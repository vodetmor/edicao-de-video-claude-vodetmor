<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão da edição</title>
<link rel="stylesheet" href="/app.css">
<style>
  :root { --fundo: #F5F5F7; --papel: #FFFFFF; --tinta: #1D1D1F; --suave: #6E6E73; --linha: #E3E3E8; --azul: #0A66E8; --azul-claro: #EAF1FD; --sobre-azul: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fundo: #111214; --papel: #1C1D20; --tinta: #F2F2F4; --suave: #A1A1A8; --linha: #2E3036; --azul: #3D8BFF; --azul-claro: #1A2A44; color-scheme: dark; } }
  :root[data-theme="dark"] { --fundo: #111214; --papel: #1C1D20; --tinta: #F2F2F4; --suave: #A1A1A8; --linha: #2E3036; --azul: #3D8BFF; --azul-claro: #1A2A44; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--tinta); font: 15px/1.45 'Inter Variable', Inter, system-ui, sans-serif; }
  .tudo { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: 100%; gap: 20px; padding-block: 20px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  .palco { display: flex; align-items: center; justify-content: center; min-height: 0; }
  .lado { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .topo { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
  .relogio { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .relogio span { font-size: 14px; font-weight: 500; color: var(--suave); margin-left: 8px; }
  .aviso { color: var(--azul); font-weight: 600; font-size: 13px; }
  .agora { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 14px; color: var(--suave); min-height: 44px; }
  .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
  button, select { font: inherit; border: 1px solid var(--linha); background: var(--papel); color: var(--tinta); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button.principal { background: var(--azul); border-color: var(--azul); color: var(--sobre-azul); font-weight: 600; }
  kbd { font: 11px/1 'Inter Variable', Inter, sans-serif; opacity: .7; border: 1px solid currentColor; border-radius: 4px; padding: 1px 4px; margin-left: 4px; }
  .nova { background: var(--papel); border: 2px solid var(--azul); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .faixa { font-weight: 600; } .faixa span { font-weight: 400; color: var(--suave); }
  textarea { font: inherit; border: 1px solid var(--linha); border-radius: 10px; padding: 10px; resize: vertical; }
  .titulo-notas { font-weight: 700; font-size: 18px; margin-top: 6px; } .titulo-notas span { font-weight: 500; font-size: 13px; color: var(--suave); margin-left: 6px; }
  .notas { display: flex; flex-direction: column; gap: 8px; }
  .vazio { color: var(--suave); }
  .nota { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: start; background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 10px; }
  .nota.corrigido { opacity: .75; } .nota.aprovado { opacity: .5; }
  .chip { background: var(--azul-claro); border-color: var(--azul-claro); color: var(--azul); font-weight: 600; font-variant-numeric: tabular-nums; padding: 4px 8px; }
  .fala { color: var(--suave); font-size: 13px; margin-top: 2px; }
  .x { border: none; background: none; font-size: 20px; line-height: 1; color: var(--suave); padding: 2px 6px; }
  .rodape { color: var(--suave); font-size: 13px; } .atalhos { margin-top: 4px; }
  .fala-toda { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; line-height: 1.8; }
  .fala-toda span { cursor: pointer; border-radius: 4px; } .fala-toda span:hover { background: var(--azul-claro); }
  .fala-toda span.ativa { background: var(--azul); color: var(--sobre-azul); }
  .erro { padding: 40px; font-size: 18px; }
  @media (max-width: 900px) { .tudo { grid-template-columns: 1fr; height: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } .palco { height: 70vh; } .nota { grid-template-columns: auto 1fr; } }
</style>
</head>
<body>
<div id="raiz"></div>
<script>window.remotion_staticBase = "/arquivos";</script>
<script src="/app.js"></script>
</body>
</html>
