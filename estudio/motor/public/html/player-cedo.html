<!-- Cena escrita do jeito HyperFrames (HTML + CSS + GSAP). Roda dentro do Remotion pelo bloco HtmlGsap.
     M.* = segundos presos às palavras faladas (definidos na spec). -->
<style>
  .pc { position:absolute; inset:0; font-family:'Inter Variable',Inter,sans-serif; color:#F2F1EE; }
  .pc .player { position:absolute; left:80px; top:330px; width:920px; height:518px; border-radius:28px; overflow:hidden;
    background:#000 url($static/img/presenter.jpg) center/cover; transform-origin:50% 0; }
  .pc .dim { position:absolute; inset:0; background:#0B0B0C; opacity:0; }
  .pc .ctrl { position:absolute; left:0; right:0; bottom:0; height:92px; background:rgba(11,11,12,.72); }
  .pc .track { position:absolute; left:32px; right:32px; bottom:26px; height:8px; border-radius:4px; background:rgba(242,241,238,.25); }
  .pc .fill { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:4px; background:#F2F1EE; }
  .pc .time { position:absolute; left:32px; bottom:44px; font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .pc .cta { position:absolute; left:50%; top:808px; transform:translateX(-50%); background:#EC5F78; color:#fff; font-weight:700;
    font-size:52px; letter-spacing:-.01em; padding:32px 70px; border-radius:999px; white-space:nowrap; }
  .pc .ring { position:absolute; inset:-10px; border:6px solid #EC5F78; border-radius:999px; opacity:0; }
  .pc .chip { position:absolute; left:50%; top:250px; transform:translateX(-50%); font-weight:700; font-size:30px; letter-spacing:.08em;
    color:#EC5F78; white-space:nowrap; }
  .pc .tl { position:absolute; left:86px; right:86px; top:1180px; height:10px; border-radius:5px; background:#2A2A2E; transform-origin:0 50%; }
  .pc .dot { position:absolute; top:-13px; width:36px; height:36px; margin-left:-18px; border-radius:18px; border:6px solid #0B0B0C; box-sizing:border-box; }
  .pc .lab { position:absolute; bottom:46px; transform:translateX(-14%); white-space:nowrap; }
  .pc .lab b { display:block; font-size:28px; letter-spacing:.08em; }
  .pc .lab i { display:block; font-style:normal; font-family:'Archivo Variable',sans-serif; font-weight:900; font-stretch:66%; font-size:92px; line-height:.95; color:#F2F1EE; }
  .pc .gap { position:absolute; top:40px; height:26px; border:4px solid #FFD84D; border-top:0; box-sizing:border-box; transform-origin:0 0; }
  .pc .big { position:absolute; left:0; right:0; top:1330px; text-align:center; font-family:'Archivo Variable',sans-serif; font-weight:900;
    font-stretch:66%; font-size:120px; line-height:.9; color:#FFD84D; }
</style>
<div class="pc">
  <div class="chip">BOTÃO NO 00:07</div>
  <div class="player"><div class="dim"></div>
    <div class="ctrl"><div class="time">00:00 / 15:00</div><div class="track"><div class="fill"></div></div></div>
  </div>
  <div class="cta"><div class="ring"></div>Quero comprar</div>
  <div class="tl">
    <div class="run" style="position:absolute;left:0.78%;top:0;bottom:0;width:83.6%;border-radius:5px;background:#F2F1EE;transform-origin:0 50%"></div>
    <div class="dot d1" style="left:0.78%;background:#EC5F78"></div>
    <div class="lab l1" style="left:0.78%;transform:translateX(-4%)"><b style="color:#EC5F78">BOTÃO</b><i>00:07</i></div>
    <div class="dot d2" style="left:84.4%;background:#3DCBEE"></div>
    <div class="lab l2" style="left:84.4%;transform:translateX(-80%)"><b style="color:#3DCBEE">OFERTA</b><i>12:40</i></div>
    <div class="gap" style="left:0.78%;width:83.6%"></div>
  </div>
  <div class="big">12 MINUTOS<br>CEDO DEMAIS</div>
</div>
<script>
  const q = gsap.utils.selector(root);
  const tl = gsap.timeline({ paused: true });
  const clock = { s: 0 };
  const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  // 1. o player entra e a VSL "toca" (relógio 00:00 -> 00:07 até a palavra "aparece")
  tl.from(q('.player'), { y: 160, scale: 0.9, opacity: 0, duration: 0.7, ease: 'expo.out' }, 0)
    .to(clock, { s: 7, duration: M.aparece, ease: 'none',
      onUpdate: () => { q('.time')[0].textContent = mmss(clock.s) + ' / 15:00'; q('.fill')[0].style.width = (clock.s / 900 * 100) + '%'; } }, 0)
  // 2. "aparece": o botão cai em cima do vídeo cedo demais
    .from(q('.cta'), { scale: 0, duration: 0.6, ease: 'back.out(2.4)' }, M.aparece)
    .fromTo(q('.ring'), { scale: 1, opacity: 1 }, { scale: 1.4, opacity: 0, duration: 0.55, ease: 'power2.out' }, M.aparece + 0.05)
  // 3. "antes": vídeo escurece, botão treme, etiqueta do tempo
    .to(q('.dim'), { opacity: 0.55, duration: 0.3, ease: 'power2.out' }, M.antes)
    .fromTo(q('.cta'), { x: 0 }, { keyframes: { x: [0, -24, 20, -14, 9, -4, 0] }, duration: 0.5, ease: 'none' }, M.antes)
    .from(q('.chip'), { y: 30, opacity: 0, duration: 0.45, ease: 'expo.out' }, M.antes + 0.08)
  // 4. "VSL": tudo sobe e a linha do tempo inteira da VSL aparece
    .to(q('.player'), { y: -120, scale: 0.78, duration: 0.6, ease: 'power3.inOut' }, M.vsl - 0.1)
    .to(q('.cta'), { y: -255, scale: 0.8, duration: 0.6, ease: 'power3.inOut' }, M.vsl - 0.1)
    .to(q('.chip'), { opacity: 0, y: -30, duration: 0.3 }, M.vsl - 0.1)
    .from(q('.tl'), { scaleX: 0, duration: 0.6, ease: 'expo.out' }, M.vsl + 0.15)
    .from(q('.d1'), { scale: 0, duration: 0.45, ease: 'back.out(3)' }, M.vsl + 0.35)
    .from(q('.l1'), { y: 30, opacity: 0, duration: 0.45, ease: 'expo.out' }, M.vsl + 0.42)
    .from(q('.run'), { scaleX: 0, duration: M.oferta - M.vsl - 0.9, ease: 'power2.inOut' }, M.vsl + 0.8)
  // 5. "oferta": a oferta só chega no 12:40 — o vão aparece medido
    .from(q('.d2'), { scale: 0, duration: 0.45, ease: 'back.out(3)' }, M.oferta - 0.1)
    .from(q('.l2'), { y: 30, opacity: 0, duration: 0.45, ease: 'expo.out' }, M.oferta - 0.05)
    .from(q('.gap'), { scaleX: 0, duration: 0.5, ease: 'expo.inOut' }, M.oferta + 0.1)
    .from(q('.big'), { y: 60, opacity: 0, duration: 0.5, ease: 'expo.out' }, M.oferta + 0.25);
  return tl;
</script>
